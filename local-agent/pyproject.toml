[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plebs-agent"
version = "0.1.0"
description = "Open-source local execution agent for Plebs.finance signals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "py-clob-client>=0.15.0",
    "eth-account>=0.13.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
plebs-agent = "daemon:cli"

[project.urls]
Homepage = "https://plebs.finance"
Repository = "https://github.com/paullyd2112/bloomberg-term-clone"
